spring.application.name=travel-billing
server.port=8080

# File-backed H2 (NOT in-memory). The database lives in ./data/billing.mv.db
# MODE=PostgreSQL keeps the SQL close to what we would run in production.
# LOCK_TIMEOUT: how long a transaction waits for a row lock held by another one (ms).
spring.datasource.url=jdbc:h2:file:./data/billing;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JSON: snake_case field names, ISO-8601 dates, exact decimals.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.generator.write-bigdecimal-as-plain=true
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
